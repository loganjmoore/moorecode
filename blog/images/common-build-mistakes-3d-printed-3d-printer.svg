<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Common build mistakes in a 3D-printed 3D printer</title>
  <desc id="desc">A diagnostic drawing marks a mixed part revision, weak layer direction, heat damage, and a distorted bearing bore.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#1b1e26"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="82" fill="#e07a5f" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FAILURE MAP</text>
  <text x="70" y="146" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="800">Find the build mistake first</text>
  <g transform="translate(70 205)">
    <rect width="650" height="320" rx="20" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <path d="M105 242h440l-35-150H140z" fill="#1b1e26" stroke="#e8eaef" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="235" cy="168" r="56" fill="#0b0c10" stroke="#f5b942" stroke-width="10"/><circle cx="235" cy="168" r="22" fill="none" stroke="#e8eaef" stroke-width="7"/>
    <path d="M345 108h118v120H345z" fill="none" stroke="#e07a5f" stroke-width="10"/>
    <path d="M355 125h98M355 145h98M355 165h98M355 185h98M355 205h98" stroke="#9aa1ad" stroke-width="4"/>
    <path d="M455 110l-24 32 21 20-29 33" fill="none" stroke="#f5b942" stroke-width="7"/>
    <g fill="#e07a5f"><circle cx="150" cy="92" r="10"/><circle cx="545" cy="92" r="10"/><circle cx="555" cy="248" r="10"/></g>
    <g stroke="#e07a5f" stroke-width="3"><path d="M150 92L85 36"/><path d="M545 92l62-50"/><path d="M555 248l58 35"/></g>
    <text x="42" y="28" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="16">REVISION</text><text x="536" y="28" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="16">HEAT</text><text x="507" y="309" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="16">LOAD PATH</text>
  </g>
  <g transform="translate(770 205)" font-family="Inter,Arial,sans-serif">
    <rect width="360" height="320" rx="20" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <text x="30" y="52" fill="#f5b942" font-size="18" font-weight="700">DIAGNOSE IN ORDER</text>
    <g fill="#e8eaef" font-size="21"><text x="30" y="100">Release + revision</text><text x="30" y="145">Material + profile</text><text x="30" y="190">Orientation + fit</text><text x="30" y="235">Assembly + heat</text><text x="30" y="280">Service + spares</text></g>
    <g fill="#e07a5f"><circle cx="326" cy="92" r="6"/><circle cx="326" cy="137" r="6"/><circle cx="326" cy="182" r="6"/><circle cx="326" cy="227" r="6"/><circle cx="326" cy="272" r="6"/></g>
  </g>
  <text x="70" y="585" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="18">Preserve the failed part, then change one supported cause at a time.</text>
</svg>
