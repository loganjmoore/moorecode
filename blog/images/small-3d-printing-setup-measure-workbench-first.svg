      <path d="M155 145l60-48 60 48M215 58V28" fill="none" stroke="#e07a5f" stroke-width="7" stroke-linecap="round"/>
      <path d="M385 55v128" stroke="#f5b942" stroke-width="5" marker-end="url(#arrow)"/>
      <text x="24" y="28" fill="#f5b942" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">FULL MOTION + SERVICE SPACE</text>
      <text x="233" y="226" text-anchor="middle" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="16">PRINTER OPERATING ENVELOPE</text>
