<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Small 3D printing setup workbench plan</title>
  <desc id="desc">A top-down measured workbench plan separates the printer envelope, source-control ventilation, inspection tools, and material storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#1b1e26"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5b942"/><stop offset="1" stop-color="#e07a5f"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f5b942"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f5b942" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">SMALL 3D PRINTING SETUP</text>
