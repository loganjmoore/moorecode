    <path d="M522 18v264M792 18v264" stroke="#343946" stroke-width="3" stroke-dasharray="10 10"/>
    <g transform="translate(28 28)">
      <rect width="466" height="244" rx="18" fill="#1b1e26" stroke="url(#accent)" stroke-width="4"/>
