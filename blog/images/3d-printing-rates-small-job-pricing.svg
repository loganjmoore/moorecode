<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">3D printing rate calculation</title>
  <desc id="desc">Material, electricity, labor, machine time, and a failure allowance combine into a two-part job price.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#1b1e26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5b942"/>
      <stop offset="1" stop-color="#e07a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="70" y="84" fill="#f5b942" font-size="21" font-weight="700" letter-spacing="3">3D PRINTING RATES</text>
    <text x="70" y="145" fill="#e8eaef" font-size="49" font-weight="800">Price the whole job.</text>
    <text x="70" y="187" fill="#9aa1ad" font-size="21">Direct costs first. Pricing rule second.</text>
  </g>

  <g transform="translate(70 245)" font-family="Inter,Arial,sans-serif">
    <g>
      <rect width="205" height="86" rx="17" fill="#14161c" stroke="#343946" stroke-width="3"/>
      <text x="20" y="32" fill="#9aa1ad" font-size="16" font-weight="700">MATERIAL</text>
      <text x="20" y="65" fill="#e8eaef" font-size="28" font-weight="800">$5.00</text>
    </g>
    <g transform="translate(225)">
      <rect width="205" height="86" rx="17" fill="#14161c" stroke="#343946" stroke-width="3"/>
      <text x="20" y="32" fill="#9aa1ad" font-size="16" font-weight="700">ELECTRICITY</text>
      <text x="20" y="65" fill="#e8eaef" font-size="28" font-weight="800">$0.144</text>
    </g>
    <g transform="translate(0 106)">
      <rect width="205" height="86" rx="17" fill="#14161c" stroke="#343946" stroke-width="3"/>
      <text x="20" y="32" fill="#9aa1ad" font-size="16" font-weight="700">LABOR</text>
      <text x="20" y="65" fill="#e8eaef" font-size="28" font-weight="800">$15.00</text>
    </g>
    <g transform="translate(225 106)">
      <rect width="205" height="86" rx="17" fill="#14161c" stroke="#343946" stroke-width="3"/>
      <text x="20" y="32" fill="#9aa1ad" font-size="16" font-weight="700">MACHINE</text>
      <text x="20" y="65" fill="#e8eaef" font-size="28" font-weight="800">$12.00</text>
    </g>
    <g transform="translate(0 212)">
      <rect width="430" height="70" rx="17" fill="#14161c" stroke="#e07a5f" stroke-width="3"/>
      <text x="20" y="29" fill="#9aa1ad" font-size="15" font-weight="700">OTHER COST + 10% FAILURE ALLOWANCE</text>
      <text x="20" y="56" fill="#e8eaef" font-size="23" font-weight="800">$3.00 + $3.5144</text>
    </g>
  </g>

  <path d="M532 385h83" stroke="#343946" stroke-width="9" stroke-linecap="round"/>
  <path d="M596 365l25 20-25 20" fill="none" stroke="#f5b942" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(654 238)" font-family="Inter,Arial,sans-serif">
    <rect width="474" height="300" rx="24" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <text x="33" y="48" fill="#9aa1ad" font-size="17" font-weight="700">TWO-PART EXAMPLE</text>
    <text x="33" y="93" fill="#e8eaef" font-size="20">Direct job cost</text>
    <text x="441" y="93" text-anchor="end" fill="#e8eaef" font-size="29" font-weight="800">$38.6584</text>
    <path d="M33 118h408" stroke="#343946" stroke-width="3"/>
    <text x="33" y="157" fill="#e8eaef" font-size="20">Markup</text>
    <text x="441" y="157" text-anchor="end" fill="#f5b942" font-size="24" font-weight="800">25%</text>
    <rect x="28" y="184" width="418" height="86" rx="17" fill="url(#accent)"/>
    <text x="49" y="218" fill="#1a1208" font-size="16" font-weight="800">SUGGESTED PRICE</text>
    <text x="425" y="251" text-anchor="end" fill="#1a1208" font-size="45" font-weight="800">$48.32</text>
  </g>
  <text x="70" y="585" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="18">A rate is a checked calculation, not a copied price per hour.</text>
</svg>
