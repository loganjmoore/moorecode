<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">High-speed 3D printer comparison</title>
  <desc id="desc">Four linked gauges show acceleration, volumetric flow, cooling, and motion control feeding a finished-part result.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#1b1e26"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f5b942"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="82" fill="#f5b942" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">HIGH-SPEED 3D PRINTER</text>
  <text x="70" y="146" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">Compare the whole system</text>
  <g transform="translate(70 215)" font-family="Inter,Arial,sans-serif">
    <g><rect width="210" height="220" rx="18" fill="#14161c" stroke="#343946" stroke-width="3"/><path d="M45 128a60 60 0 01120 0" fill="none" stroke="#343946" stroke-width="14"/><path d="M45 128a60 60 0 0184-55" fill="none" stroke="#f5b942" stroke-width="14"/><path d="M105 128l38-42" stroke="#e07a5f" stroke-width="7"/><text x="105" y="178" text-anchor="middle" fill="#e8eaef" font-size="20" font-weight="700">ACCELERATION</text></g>
    <g transform="translate(245)"><rect width="210" height="220" rx="18" fill="#14161c" stroke="#343946" stroke-width="3"/><path d="M105 48c34 42 53 67 53 93a53 53 0 01-106 0c0-26 19-51 53-93z" fill="none" stroke="#f5b942" stroke-width="9"/><text x="105" y="178" text-anchor="middle" fill="#e8eaef" font-size="20" font-weight="700">FLOW</text></g>
    <g transform="translate(490)"><rect width="210" height="220" rx="18" fill="#14161c" stroke="#343946" stroke-width="3"/><circle cx="105" cy="103" r="57" fill="none" stroke="#343946" stroke-width="9"/><path d="M105 49v108M51 103h108M67 65l76 76M143 65l-76 76" stroke="#e07a5f" stroke-width="7"/><text x="105" y="178" text-anchor="middle" fill="#e8eaef" font-size="20" font-weight="700">COOLING</text></g>
    <g transform="translate(735)"><rect width="210" height="220" rx="18" fill="#14161c" stroke="#343946" stroke-width="3"/><path d="M45 130c25-78 42 78 64 0s40 78 56 0" fill="none" stroke="#e07a5f" stroke-width="7"/><path d="M45 105c25-38 42 38 64 0s40 38 56 0" fill="none" stroke="#f5b942" stroke-width="7"/><text x="105" y="178" text-anchor="middle" fill="#e8eaef" font-size="20" font-weight="700">CONTROL</text></g>
    <path d="M955 110h90" stroke="#f5b942" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(1010 25)"><path d="M20 130h85V40H20zM8 142h109" fill="none" stroke="#e8eaef" stroke-width="8"/><text x="62" y="180" text-anchor="middle" fill="#9aa1ad" font-size="15">PASSING PART</text></g>
  </g>
  <text x="70" y="515" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="20">Top speed is one input. Repeatable, acceptable parts are the result.</text>
  <path d="M70 555h1060" stroke="#343946" stroke-width="2"/>
  <text x="70" y="592" fill="#e07a5f" font-family="Inter,Arial,sans-serif" font-size="17">TIME · DIMENSIONS · SURFACE · MASS · ENERGY · YIELD</text>
</svg>
