  <text x="76" y="160" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800">3D printmaking</text>
  <text x="76" y="207" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="25">mirror · model · print · ink · proof</text>
