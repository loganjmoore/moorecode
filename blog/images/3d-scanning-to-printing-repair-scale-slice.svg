<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">3D scanning to printing workflow</title>
  <desc id="desc">A rough scanned mesh is repaired, measured with calipers, and turned into printable layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c10"/><stop offset="1" stop-color="#1b1e26"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5b942"/><stop offset="1" stop-color="#e07a5f"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="92" fill="#f5b942" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">3D SCANNING AND PRINTING</text>
  <text x="70" y="157" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">Repair. Scale. Slice.</text>
  <text x="70" y="201" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="22">Turn a captured surface into a measured print file</text>
  <g transform="translate(82 268)">
    <rect x="0" y="0" width="274" height="218" rx="24" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <path d="M63 159l20-73 54-31 68 24 20 79-41 26-82-3z" fill="none" stroke="#9aa1ad" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M83 86l45 37 77-44M128 123l56 61M102 181l26-58M205 79l-21 105" fill="none" stroke="#e07a5f" stroke-width="3" opacity=".8"/>
    <circle cx="62" cy="158" r="7" fill="#e07a5f"/><circle cx="225" cy="158" r="7" fill="#e07a5f"/>
    <text x="137" y="256" text-anchor="middle" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">1 · CAPTURE</text>
  </g>
  <path d="M374 377h75" stroke="#343946" stroke-width="8" stroke-linecap="round"/><path d="M433 361l20 16-20 16" fill="none" stroke="#f5b942" stroke-width="6"/>
  <g transform="translate(467 268)">
    <rect x="0" y="0" width="274" height="218" rx="24" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <path d="M57 164l26-78 54-31 68 24 22 79-43 26-82-3z" fill="none" stroke="#f5b942" stroke-width="5"/>
    <path d="M83 86l45 37 77-44M128 123l56 61M102 181l26-58M205 79l-21 105" fill="none" stroke="#f5b942" stroke-width="3" opacity=".7"/>
    <circle cx="72" cy="67" r="10" fill="#e07a5f"/><path d="M66 67l5 5 10-13" fill="none" stroke="#1a1208" stroke-width="4" stroke-linecap="round"/>
    <text x="137" y="256" text-anchor="middle" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">2 · REPAIR</text>
  </g>
  <path d="M759 377h75" stroke="#343946" stroke-width="8" stroke-linecap="round"/><path d="M818 361l20 16-20 16" fill="none" stroke="#f5b942" stroke-width="6"/>
  <g transform="translate(852 268)">
    <rect x="0" y="0" width="274" height="218" rx="24" fill="#14161c" stroke="#343946" stroke-width="3"/>
    <path d="M47 65h180M47 94h180M47 123h180M47 152h180" stroke="url(#hot)" stroke-width="9" stroke-linecap="round"/>
    <path d="M64 42v134M210 42v134" stroke="#e8eaef" stroke-width="4"/>
    <path d="M64 39l14 14M64 39L50 53M210 39l14 14M210 39l-14 14" stroke="#f5b942" stroke-width="5" stroke-linecap="round"/>
    <text x="137" y="256" text-anchor="middle" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">3 · SCALE + SLICE</text>
  </g>
  <text x="70" y="582" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="18">A clean mesh can still fail when the physical scale is wrong.</text>
</svg>
