<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Desktop 3D printing workspace</title>
  <desc id="desc">A workbench diagram labels printer, ventilation, clean tools, and dry material storage.</desc>
  <defs>
