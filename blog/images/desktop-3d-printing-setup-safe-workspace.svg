  <text x="70" y="157" fill="#e8eaef" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">Build the workspace first</text>
  <text x="70" y="201" fill="#9aa1ad" font-family="Inter,Arial,sans-serif" font-size="22">Space, source control, tools, and material storage</text>
